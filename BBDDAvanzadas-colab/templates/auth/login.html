{% extends "base.html" %}
{% block content %}
<div class="container page-enter" style="max-width:420px;margin-top:80px;">
  <div class="detail-card" style="padding:36px;">
    <div style="display:flex;justify-content:center;margin-bottom:20px;">
      <div class="detail-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </div>
    </div>
    <div class="detail-name" style="text-align:center;margin-bottom:4px;">Iniciar sesión</div>
    <div class="detail-sub" style="text-align:center;margin-bottom:28px;">Gestor Académico · BDA Práctica 4</div>

    {% if error %}
    <script>document.addEventListener('DOMContentLoaded', () => showToast({{ error | tojson }}, true));</script>
    {% endif %}

    <form method="post">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input class="form-input" type="text" name="username" placeholder="admin / profesor / alumno"
               autocomplete="username" autofocus />
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••"
               autocomplete="current-password" />
      </div>
      <div class="form-actions" style="margin-top:24px;">
        <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
